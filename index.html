<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Invite</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.background {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity 0.3s ease;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
}

.card {
  position: relative;
  z-index: 2;
  width: calc(100% - 30px);
  max-width: 400px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);
  padding: 28px 22px;
  text-align: center;
  border-radius: 24px;
  background: rgba(255,255,255,0.94);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

.profile {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid white;
}

h1 {
  margin: 15px 0 8px;
  font-size: 27px;
}

.sub {
  color: #555;
  margin-bottom: 25px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  margin-top: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.enter {
  background: #128c7e;
  color: white;
}
</style>
</head>

<body>

<div class="background" id="background"></div>
<div class="overlay"></div>

<div class="card">

  <img class="profile" src="https://via.placeholder.com/200" alt="Group">

 <h1>Girls Cum 🥵💦</h1>

  <div class="sub">
    Join our WhatsApp group
  </div>

  <button class="enter" onclick="enterGroup()">
    Enter Group
  </button>

</div>

<script>

/* YAHAN APNI PHOTOS KE FILE NAME DALO */
const backgrounds = [
  "32f5079aacb0aaa6fcace8eec2114be7.jpg",
  "4da4a53922e4e5f1a29407f1b3d30857.jpg",
  "6a0d57d280da3ff55e2a45dc4d65fbac.jpg",
  "d39bafd1559ac1ed8c81262bf92b67b0.jpg"
];
];

let current = 0;
const bg = document.getElementById("background");

function changeBackground() {
  bg.style.backgroundImage =
    "url('" + backgrounds[current] + "')";

  current++;

  if (current >= backgrounds.length) {
    current = 0;
  }
}

/* FIRST PHOTO */
changeBackground();

/* HAR 1 SECOND MEIN CHANGE */
setInterval(changeBackground, 1000);


/* WHATSAPP GROUP */
function enterGroup() {
  window.location.href =
    "https://chat.whatsapp.com/IuzzLjwwTz319l2ieYw81R";
}

</script>

</body>
</html>
